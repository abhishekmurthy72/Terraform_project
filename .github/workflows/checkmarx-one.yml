name: Checkmarx One Code Scanning Alerts

on:
  push:
    branches: 
      - main
      - master
      - dev
      - Terraform-project-1
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [ "Terraform-project-1" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cat <<'EOF' > scrape_checkmarx.py
          import requests
          from bs4 import BeautifulSoup

          url = "https://eu-status.ast.checkmarx.net/"
          try:
              response = requests.get(url)
              response.raise_for_status()  # Raise an error for bad responses
              
              # Parse the HTML content using BeautifulSoup
              soup = BeautifulSoup(response.text, 'html.parser')
              
              # Extract the desired information; you may need to adjust this
              status_element = soup.find("div", class_="status")  # Adjust selector based on actual page structure

              if status_element:
                  status = status_element.text.strip()
              else:
                  status = "No status found"
                  print("Status element not found. Here is the full HTML response:")
                  print(soup.prettify())  # Log the entire HTML for debugging

              print(f"Scraped status: {status}")
              
              if "down" in status.lower():  # Adjust logic as necessary
                  print("Checkmarx server is down. Proceeding without breaking the build.")
                  exit(0)

          except requests.exceptions.RequestException as e:
              print(f"Error during requests to {url}: {e}")
              print("Proceeding without breaking the build.")
              exit(0)  # Proceed without breaking

          except Exception as e:
              print(f"An unexpected error occurred: {e}")
              print("Proceeding without breaking the build.")
              exit(0)  # Proceed without breaking

          EOF
          python3 scrape_checkmarx.py

      - name: Check Checkmarx One server health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://ind-status.ast.checkmarx.net/)
          if [ "$response" != "200" ]; then
            echo "Checkmarx One server is down. Proceeding without breaking the build."
            exit 0  # Do not fail the build
          else
            echo "Checkmarx One server is healthy. Proceeding with scan."
          fi

      - name: Checkmarx One scan
        uses: checkmarx/ast-github-action@main
        with:
          base_uri: https://ind.ast.checkmarx.net
          cx_client_id: ${{ vars.CLIENT_ID }}
          cx_client_secret: ${{ secrets.SECRET }}
          cx_tenant: ${{ vars.TENANT }}
          additional_params: --report-format sarif --output-path .

      # - name: Upload SARIF file
      #   uses: github/codeql-action/upload-sarif@v2
      #   with:
      #     sarif_file: cx_result.sarif



